name: ITDSL TypeScript

on:
  push:
    paths:
      - "docs/DSL/**"
      - "examples/**"
      - ".github/workflows/itdsl-typescript.yml"
  pull_request:
    paths:
      - "docs/DSL/**"
      - "examples/**"
      - ".github/workflows/itdsl-typescript.yml"

permissions:
  contents: read

jobs:
  generated-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate TypeScript from DSL
        run: node docs/DSL/compiler.mjs examples/delivery.itdsl docs/DSL/2typescript/generated typescript
      - name: Classify generated language
        run: |
          language="$(node docs/DSL/classify-generated.mjs docs/DSL/2typescript/generated | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).language))')"
          test "$language" = "typescript"
      - name: Execute generated TypeScript
        working-directory: docs/DSL/2typescript/generated
        run: npx --yes tsx delivery.test.ts
      - name: Re-generate and compare
        run: |
          tmp="$(mktemp -d)"
          node docs/DSL/compiler.mjs examples/delivery.itdsl "$tmp" typescript >/dev/null
          cmp docs/DSL/2typescript/generated/delivery.ts "$tmp/delivery.ts"
          cmp docs/DSL/2typescript/generated/delivery.test.ts "$tmp/delivery.test.ts"
