name: ITDSL Python

on:
  push:
    paths:
      - "docs/DSL/**"
      - "examples/**"
      - ".github/workflows/itdsl-python.yml"
  pull_request:
    paths:
      - "docs/DSL/**"
      - "examples/**"
      - ".github/workflows/itdsl-python.yml"

permissions:
  contents: read

jobs:
  generated-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate compiler
        run: node docs/DSL/compiler.test.mjs
      - name: Generate Python from DSL
        run: node docs/DSL/compiler.mjs examples/delivery.itdsl docs/DSL/python/generated python
      - name: Classify generated language
        run: |
          language="$(node docs/DSL/classify-generated.mjs docs/DSL/python/generated | python -c 'import json,sys; print(json.load(sys.stdin)["language"])')"
          test "$language" = "python"
      - name: Execute generated Python
        working-directory: docs/DSL/python/generated
        run: python -m unittest -v
      - name: Re-generate and compare
        run: |
          tmp="$(mktemp -d)"
          node docs/DSL/compiler.mjs examples/delivery.itdsl "$tmp" python >/dev/null
          cmp docs/DSL/python/generated/generated.py "$tmp/generated.py"
          cmp docs/DSL/python/generated/test_generated.py "$tmp/test_generated.py"
