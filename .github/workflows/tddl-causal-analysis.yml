name: T-DD Causal Analysis

on:
  push:
    paths:
      - "docs/DSL/trajectory-causality.mjs"
      - "docs/DSL/trajectory-causality.test.mjs"
      - "docs/DSL/trajectory_causality.py"
      - "docs/DSL/test_trajectory_causality.py"
      - ".github/workflows/tddl-causal-analysis.yml"
  pull_request:
    paths:
      - "docs/DSL/trajectory-causality.mjs"
      - "docs/DSL/trajectory-causality.test.mjs"
      - "docs/DSL/trajectory_causality.py"
      - "docs/DSL/test_trajectory_causality.py"
      - ".github/workflows/tddl-causal-analysis.yml"

jobs:
  deterministic-causal-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test JavaScript reference runtime
        run: node --test docs/DSL/trajectory-causality.test.mjs
      - name: Test Python runtime
        run: python -m unittest docs/DSL/test_trajectory_causality.py -v
